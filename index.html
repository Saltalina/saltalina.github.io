<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Union Raid Diff — 45 → 45a</title>
<style>
:root {
  --bg: #0f1117;
  --bg-2: #151824;
  --bg-3: #1b1f2e;
  --border: #262b3d;
  --text: #e6e9f2;
  --muted: #8b93a7;
  --accent: #5865f2;
  --accent-2: #7c8cff;
  --green: #3ddc84;
  --red: #ff5d5d;
  --amber: #ffb454;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.45 "Segoe UI", system-ui, sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ---------- top bar ---------- */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 14px 20px;
  background: linear-gradient(180deg, var(--bg-2), var(--bg));
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 12px; }
.logo {
  width: 40px; height: 40px;
  display: grid; place-items: center;
  font-size: 20px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--accent), #9b59f6);
  box-shadow: 0 4px 18px rgba(88, 101, 242, 0.35);
}
.brand h1 { font-size: 17px; font-weight: 650; letter-spacing: 0.2px; }
.brand .sub { font-size: 12px; color: var(--muted); }

.controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

select, input[type="search"] {
  background: var(--bg-3);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 10px;
  padding: 9px 12px;
  font-size: 13px;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
select:focus, input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(88, 101, 242, 0.18);
}
select { min-width: 130px; cursor: pointer; }

/* ---------- toolbar ---------- */
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 10px 20px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}
#searchBox { width: 300px; }
.stats { color: var(--muted); font-size: 12.5px; display: flex; gap: 14px; }
.stats b { color: var(--text); font-weight: 600; }
.stats .up { color: var(--green); }
.stats .down { color: var(--red); }
.stats .miss { color: var(--amber); }
.stats .new { color: var(--green); }

/* ---------- table ---------- */
.table-wrap { flex: 1; overflow: auto; padding: 0 20px 20px; }

table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  margin-top: 14px;
}
thead th {
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--bg-2);
  color: var(--muted);
  font-size: 11.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  text-align: left;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  user-select: none;
}
thead th.num { text-align: right; }
thead th:hover { color: var(--text); }
thead th.sorted-asc::after { content: " ▲"; color: var(--accent-2); }
thead th.sorted-desc::after { content: " ▼"; color: var(--accent-2); }

tbody td {
  padding: 9px 14px;
  border-bottom: 1px solid rgba(38, 43, 61, 0.55);
  font-variant-numeric: tabular-nums;
}
tbody td.num { text-align: right; }
tbody tr { transition: background 0.1s; }
tbody tr:hover { background: rgba(88, 101, 242, 0.07); }
tbody tr:nth-child(even) { background: rgba(255, 255, 255, 0.015); }
tbody tr:nth-child(even):hover { background: rgba(88, 101, 242, 0.07); }

.rank-cell {
  display: inline-grid;
  place-items: center;
  min-width: 30px;
  padding: 2px 8px;
  border-radius: 8px;
  background: var(--bg-3);
  border: 1px solid var(--border);
  font-weight: 600;
  font-size: 12.5px;
}
tr:nth-child(-n+3) .rank-cell {
  background: linear-gradient(135deg, rgba(88,101,242,0.25), rgba(155,89,246,0.25));
  border-color: rgba(124, 140, 255, 0.5);
  color: #cdd4ff;
}

.union-cell { font-weight: 600; }
.id-cell { color: var(--muted); font-size: 12.5px; }

.server-tag {
  display: inline-block;
  padding: 2px 9px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.5px;
  background: rgba(88, 101, 242, 0.14);
  border: 1px solid rgba(88, 101, 242, 0.35);
  color: var(--accent-2);
}

.dmg { color: #c8cede; }
.dmg-null { color: #4a5065; }

.change-up { color: var(--green); font-weight: 600; }
.change-down { color: var(--red); font-weight: 600; }
.change-zero { color: var(--muted); }
.change-null { color: #4a5065; }

tr.row-added td { background: rgba(255, 180, 84, 0.06); }
tr.row-added .union-cell::after {
  content: "MISSING IN 45a";
  margin-left: 8px;
  padding: 2px 7px;
  border-radius: 6px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: #1a1408;
  background: var(--amber);
  vertical-align: middle;
}

tr.row-new .union-cell::after {
  content: "NEW IN 45a";
  margin-left: 8px;
  padding: 2px 7px;
  border-radius: 6px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: #06180d;
  background: var(--green);
  vertical-align: middle;
}

.empty {
  text-align: center;
  color: var(--muted);
  padding: 60px 0;
}

/* scrollbars */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #2b3147; border-radius: 6px; }
::-webkit-scrollbar-thumb:hover { background: #39415e; }
::-webkit-scrollbar-track { background: transparent; }
</style>
</head>

70668403806,"change":null,"isNew":false,"added":true,"grank":null},{"name":"GAMMA","id":3329,"server":"SEA","dn":null,"dof":2260533201189,"change":null,"isNew":false,"added":true,"grank":null},{"name":"LANCELOT","id":10,"server":"SEA","dn":null,"dof":2133627677079,"change":null,"isNew":false,"added":true,"grank":null},{"name":"姬你太美","id":2330,"server":"SEA","dn":null,"dof":2093672877726,"change":null,"isNew":false,"added":true,"grank":null},{"name":"FRAISIER","id":10063,"server":"SEA","dn":null,"dof":2078521703992,"change":null,"isNew":false,"added":true,"grank":null},{"name":"ALTER","id":441,"server":"SEA","dn":null,"dof":1903348399870,"change":null,"isNew":false,"added":true,"grank":null}];
const REGIONS = ["GLOBAL", "HMT", "JP", "KR", "NA", "SEA"];

const els = {
  region: document.getElementById('regionSelect'),
  search: document.getElementById('searchBox'),
  tbody: document.getElementById('tbody'),
  stats: document.getElementById('stats'),
  empty: document.getElementById('emptyState'),
  headers: document.querySelectorAll('thead th'),
};

let rows = [];
let sortKey = 'rank';
let sortDir = 1; // 1 asc, -1 desc

const fmt = (n) => (n == null ? '—' : n.toLocaleString('en-US'));
const fmtShort = (n) => {
  if (n == null) return '—';
  const abs = Math.abs(n);
  if (abs >= 1e12) return (n / 1e12).toFixed(2) + 'T';
  if (abs >= 1e9) return (n / 1e9).toFixed(2) + 'B';
  if (abs >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  return n.toLocaleString('en-US');
};

function setRegion(region) {
  if (region === 'ALL') {
    rows = DATA.map((r) => ({ ...r, rank: r.grank ?? r.rank }));
  } else {
    rows = DATA.filter((r) => r.server === region);
  }
  render();
}

function currentView() {
  const q = els.search.value.trim().toLowerCase();
  let view = rows;
  if (q) {
    view = view.filter(
      (r) =>
        (r.name || '').toLowerCase().includes(q) ||
        String(r.id ?? '').includes(q) ||
        (r.server || '').toLowerCase().includes(q),
    );
  }
  const dir = sortDir;
  return [...view].sort((a, b) => {
    // missing rows always pinned to bottom
    if (a.added !== b.added) return a.added ? 1 : -1;
    const av = a[sortKey];
    const bv = b[sortKey];
    if (av == null && bv == null) return 0;
    if (av == null) return 1;
    if (bv == null) return -1;
    if (typeof av === 'string') return av.localeCompare(bv) * dir;
    return (av - bv) * dir;
  });
}

function render() {
  const view = currentView();
  els.tbody.innerHTML = '';
  const frag = document.createDocumentFragment();

  for (const r of view) {
    const tr = document.createElement('tr');
    if (r.added) tr.className = 'row-added';
    else if (r.isNew) tr.className = 'row-new';

    const changeCell = r.added
      ? '<span class="change-null">—</span>'
      : r.change == null
        ? '<span class="change-null">—</span>'
        : r.change > 0
          ? `<span class="change-up">▲ +${fmtShort(r.change)}</span>`
          : r.change < 0
            ? `<span class="change-down">▼ ${fmtShort(r.change)}</span>`
            : '<span class="change-zero">0</span>';

    tr.innerHTML = `
      <td class="num"><span class="rank-cell">${r.rank ?? '—'}</span></td>
      <td class="union-cell">${escapeHtml(r.name ?? '?')}</td>
      <td class="num id-cell">${r.id ?? '—'}</td>
      <td><span class="server-tag">${escapeHtml(r.server)}</span></td>
      <td class="num ${r.dn == null ? 'dmg-null' : 'dmg'}" title="${fmt(r.dn)}">${fmtShort(r.dn)}</td>
      <td class="num ${r.dof == null ? 'dmg-null' : 'dmg'}" title="${fmt(r.dof)}">${fmtShort(r.dof)}</td>
      <td class="num" title="${r.change == null ? '' : fmt(r.change)}">${changeCell}</td>`;
    frag.appendChild(tr);
  }
  els.tbody.appendChild(frag);
  els.empty.hidden = view.length > 0;

  const changed = rows.filter((r) => r.change != null);
  const up = changed.filter((r) => r.change > 0).length;
  const down = changed.filter((r) => r.change < 0).length;
  const missing = rows.filter((r) => r.added).length;
  const fresh = rows.filter((r) => r.isNew).length;
  els.stats.innerHTML =
    `<span><b>${rows.length}</b> unions</span>` +
    `<span class="up">▲ ${up}</span>` +
    `<span class="down">▼ ${down}</span>` +
    (fresh ? `<span class="new">✚ ${fresh} new in 45a</span>` : '') +
    (missing ? `<span class="miss">⚠ ${missing} missing in 45a</span>` : '');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* events */
els.region.addEventListener('change', () => {
  localStorage.setItem('region', els.region.value);
  setRegion(els.region.value);
});
els.search.addEventListener('input', render);

els.headers.forEach((th) => {
  th.addEventListener('click', () => {
    const key = th.dataset.key;
    if (sortKey === key) sortDir = -sortDir;
    else { sortKey = key; sortDir = 1; }
    els.headers.forEach((h) => h.classList.remove('sorted-asc', 'sorted-desc'));
    th.classList.add(sortDir === 1 ? 'sorted-asc' : 'sorted-desc');
    render();
  });
});

/* init */
els.region.appendChild(new Option('All Regions', 'ALL'));
for (const r of REGIONS) els.region.appendChild(new Option(r, r));
const saved = localStorage.getItem('region');
els.region.value = REGIONS.includes(saved) || saved === 'ALL' ? saved : 'ALL';
setRegion(els.region.value);
</script>
